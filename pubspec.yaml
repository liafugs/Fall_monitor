name: fall_monitor
description: Monitor de quedas para idosos (ESP32 + IMU) com estimativa de severidade.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_blue_plus: ^1.35.0
  fl_chart: ^0.69.0
  path_provider: ^2.1.4
  share_plus: ^10.0.0

flutter:
  uses-material-design: true
